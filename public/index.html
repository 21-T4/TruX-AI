<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TruX AI Assistant</title>
  <base target="_top">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#080a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TruX-AI">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-main: #07090e;
      --bg-sidebar: rgba(13, 16, 25, 0.85);
      --bg-card: rgba(18, 22, 34, 0.75);
      --bg-input: rgba(18, 22, 35, 0.9);
      --bg-hover: rgba(28, 34, 52, 0.85);
      --text-main: #f0f3f9;
      --text-muted: #8e96a5;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #00bfff;
      --accent-purple: #9b51e0;
      --accent-pink: #ff007f;
      --error: #ff5555;
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
    }

    body.dark-mode-off {
      --bg-main: #0e121a;
      --bg-sidebar: #131924;
      --bg-card: #18202e;
      --bg-input: #1b2434;
      --bg-hover: #242f44;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Poppins', sans-serif; display: flex; height: 100dvh; width: 100vw; overflow: hidden; position: relative; transition: background-color 0.4s ease; }
    
    .dark-ambient-container { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; 
      background: radial-gradient(ellipse at 15% 20%, rgba(255, 0, 128, 0.18) 0%, transparent 45%),
                  radial-gradient(ellipse at 85% 75%, rgba(0, 191, 255, 0.2) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 40%, rgba(155, 81, 224, 0.18) 0%, transparent 60%);
      transition: opacity 0.8s ease; filter: blur(30px);
    }
    body.chat-active .dark-ambient-container { opacity: 0.35; }
    
    .menu-toggle-btn, .settings-toggle-btn { position: absolute; top: 16px; z-index: 100; background: var(--bg-input); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; cursor: pointer; color: #ffffff; font-size: 18px; line-height: 1; transition: all 0.3s; box-shadow: var(--glass-shadow); }
    .menu-toggle-btn { left: 16px; }
    .settings-toggle-btn { left: 66px; }
    .menu-toggle-btn:hover { background: var(--bg-hover); border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 191, 255, 0.4); }
    .settings-toggle-btn:hover { background: var(--bg-hover); border-color: var(--accent-purple); box-shadow: 0 0 20px rgba(155, 81, 224, 0.4); transform: rotate(45deg); }

    .mobile-new-chat-btn { display: none; position: absolute; top: 16px; right: 16px; z-index: 100; background: var(--bg-input); border: 1px solid var(--accent); color: #ffffff; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 0 15px rgba(0, 191, 255, 0.3); }
    
    .sidebar-overlay { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 9; }
    
    .history-sidebar { width: 330px; background: var(--bg-sidebar); backdrop-filter: blur(24px); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; flex-shrink: 0; transition: margin-left 0.3s ease, transform 0.3s ease; box-shadow: var(--glass-shadow); }
    .history-sidebar.collapsed { margin-left: -330px; }
    
    .sidebar-header { padding: 16px; display: flex; flex-direction: row; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); }
    
    .new-chat-btn { flex: 1; background: rgba(0, 191, 255, 0.12); border: 1px solid rgba(0, 191, 255, 0.35); color: #ffffff; padding: 11px 12px; border-radius: 14px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.25s; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15); }
    .new-chat-btn:hover { background: rgba(0, 191, 255, 0.25); border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 191, 255, 0.3); }
    
    .header-action-btn { background: rgba(155, 81, 224, 0.12); border: 1px solid rgba(155, 81, 224, 0.35); color: #ffffff; padding: 11px; border-radius: 14px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s; line-height: 1; }
    .header-action-btn:hover { background: rgba(155, 81, 224, 0.28); border-color: var(--accent-purple); box-shadow: 0 0 15px rgba(155, 81, 224, 0.35); }
    .header-action-btn.pwa-btn { background: rgba(255, 0, 127, 0.12); border-color: rgba(255, 0, 127, 0.35); display: none; }

    .sidebar-close-btn { display: none; background: transparent; border: none; color: #ffffff; font-size: 24px; cursor: pointer; line-height: 1; padding: 0 4px; opacity: 0.7; }
    .sidebar-close-btn:hover { opacity: 1; }

    .history-list { flex-grow: 1; overflow-y: auto; padding: 12px 8px; }
    .history-item-wrapper { display: flex; align-items: center; justify-content: space-between; border-radius: 12px; margin-bottom: 6px; padding-right: 8px; transition: all 0.2s; border: 1px solid transparent; }
    .history-item-wrapper:hover, .history-item-wrapper.active { background: var(--bg-hover); border-color: rgba(0, 191, 255, 0.25); box-shadow: inset 0 0 10px rgba(0, 191, 255, 0.05); }
    .history-item { padding: 12px 14px; font-size: 13.5px; cursor: pointer; color: #c4c7c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }
    
    .profile-footer { border-top: 1px solid var(--border-color); padding: 16px; background: rgba(8, 9, 13, 0.6); backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: background 0.2s; }
    .profile-footer:hover { background-color: var(--bg-hover); }
    .profile-card { display: flex; align-items: center; gap: 14px; pointer-events: none; }
    .profile-avatar { width: 42px; height: 42px; border-radius: 50%; background-color: #2a2b2d; border: 1.5px solid var(--accent); object-fit: cover; box-shadow: 0 0 12px rgba(0, 191, 255, 0.3); }
    .profile-details { flex-grow: 1; overflow: hidden; }
    .profile-name { font-size: 14px; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-email { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .main-chat-arena { flex-grow: 1; display: flex; flex-direction: column; height: 100%; position: relative; z-index: 5; overflow: hidden; }
    .welcome-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; flex-grow: 1; text-align: center; padding: 20px; z-index: 2; transition: opacity 0.3s; }
    .welcome-title { font-size: clamp(38px, 6vw, 56px); font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, #ff007f 0%, #a100ff 30%, #00bfff 70%, #ff007f 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: metallicFlow 5s linear infinite; filter: drop-shadow(0 0 20px rgba(0, 191, 255, 0.35)); }
    
    .x-anim { display: inline-block; -webkit-text-fill-color: #ffffff; color: #ffffff; animation: pulseX 2s infinite alternate; margin-left: 2px;}
    @keyframes pulseX { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.18); opacity: 1; text-shadow: 0 0 20px rgba(0, 191, 255, 0.9); } }
    @keyframes metallicFlow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    
    .chat-container { display: none; flex-grow: 1; overflow-y: auto; padding: 30px 40px; scroll-behavior: smooth; }
    .message-row { display: flex; flex-direction: column; margin-bottom: 28px; max-width: 840px; width: 100%; margin-left: auto; margin-right: auto; }
    .message-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
    .user-row .message-label { color: var(--text-muted); align-self: flex-end; }
    .trux-row .message-label { background: linear-gradient(90deg, #00bfff, #c58af9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .bubble { padding: 18px 22px; border-radius: 20px; font-size: 15px; line-height: 1.6; word-wrap: break-word; user-select: text !important; -webkit-user-select: text !important; }
    .user-bubble { background: rgba(22, 24, 34, 0.9); color: #f1f1f1; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid rgba(0, 191, 255, 0.25); max-width: 85%; white-space: pre-wrap; box-shadow: var(--glass-shadow); }
    .trux-bubble { background: var(--bg-card); backdrop-filter: blur(20px); color: var(--text-main); align-self: flex-start; border-top-left-radius: 4px; border: 1px solid rgba(155, 81, 224, 0.3); width: 100%; box-shadow: var(--glass-shadow), inset 0 0 15px rgba(155, 81, 224, 0.05); }

    /* Generated Image Card UI */
    .generated-image-card { margin-top: 12px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(0, 191, 255, 0.3); background: rgba(0,0,0,0.4); box-shadow: 0 8px 30px rgba(0, 191, 255, 0.2); }
    .generated-img { width: 100%; max-height: 480px; object-fit: contain; cursor: zoom-in; display: block; border-bottom: 1px solid var(--border-color); }
    .image-card-actions { padding: 10px 14px; display: flex; justify-content: flex-end; background: rgba(12, 14, 22, 0.8); }
    .img-download-btn { background: rgba(0, 191, 255, 0.15); border: 1px solid var(--accent); color: var(--accent); text-decoration: none; padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .img-download-btn:hover { background: var(--accent); color: #000000; box-shadow: 0 0 12px rgba(0, 191, 255, 0.5); }

    .code-block-wrapper { margin: 12px 0; border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; background: #08090e; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); }
    .code-header { display: flex; justify-content: space-between; align-items: center; background: #12141f; padding: 8px 16px; border-bottom: 1px solid var(--border-color); font-size: 12px; color: var(--accent); font-family: monospace; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .copy-code-btn { background: rgba(0, 191, 255, 0.12); border: 1px solid rgba(0, 191, 255, 0.3); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Poppins', sans-serif; font-weight: 500; }
    .copy-code-btn:hover { background: var(--accent); color: #000000; box-shadow: 0 0 12px rgba(0, 191, 255, 0.5); }
    pre { padding: 14px; overflow-x: auto; font-family: monospace; margin: 0; background: transparent; border: none; }
    code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 14px; color: #00bfff; }
    pre code { background: transparent; padding: 0; color: #e3e3e3; }

    .fade-in-text { opacity: 0; animation: smoothFadeIn 0.4s ease-out forwards; }
    @keyframes smoothFadeIn { to { opacity: 1; } }

    .message-actions { display: flex; gap: 8px; margin-top: 8px; align-self: flex-start; }
    .read-aloud-btn, .retry-btn { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 14px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; font-family: inherit; font-weight: 500; }
    .read-aloud-btn:hover { background: var(--bg-hover); color: #ffffff; border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 191, 255, 0.2); }
    .retry-btn { border-color: rgba(255, 85, 85, 0.4); color: #ff7777; }
    .retry-btn:hover { background: rgba(255, 85, 85, 0.15); color: #ffffff; border-color: var(--error); box-shadow: 0 0 12px rgba(255, 85, 85, 0.3); }

    .trux-bubble.thinking-box { width: auto; display: inline-flex; align-items: center; padding: 12px 24px; background: rgba(255, 255, 255, 0.04); border-radius: 24px; border: 1px solid rgba(0, 191, 255, 0.3); box-shadow: 0 0 20px rgba(0, 191, 255, 0.15); }
    .thinking-loader-container { display: flex; align-items: center; gap: 12px; }
    .thinking-dots { display: flex; gap: 6px; align-items: center; }
    .thinking-dot { width: 9px; height: 9px; border-radius: 50%; animation: geminiPulse 1.4s infinite ease-in-out both; }
    .dot-1 { background-color: #00BFFF; animation-delay: -0.32s; }
    .dot-2 { background-color: #9B51E0; animation-delay: -0.16s; }
    .dot-3 { background-color: #FF007F; }
    @keyframes geminiPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; box-shadow: none; }
      40% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px currentColor; }
    }
    .thinking-status-text { font-size: 14px; font-weight: 600; background: linear-gradient(90deg, #00bfff 0%, #c58af9 50%, #ff007f 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: statusGlow 2.5s linear infinite; }
    @keyframes statusGlow { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

    .input-section { padding: 16px 24px 24px; background: linear-gradient(to top, var(--bg-main) 85%, transparent); z-index: 5; display: flex; flex-direction: column; align-items: center; width: 100%; }
    
    .model-selector-simple { margin-bottom: 12px; max-width: 840px; width: 100%; display: flex; justify-content: flex-start; }
    .model-select { background: var(--bg-card); color: var(--accent); border: 1px solid rgba(0, 191, 255, 0.3); border-radius: 14px; padding: 8px 14px; font-size: 13px; font-family: inherit; font-weight: 600; outline: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 10px rgba(0, 191, 255, 0.1); }
    .model-select:hover { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 191, 255, 0.3); }

    .input-wrapper { width: 100%; max-width: 840px; background: var(--bg-input); backdrop-filter: blur(20px); border: 1px solid rgba(155, 81, 224, 0.35); border-radius: 28px; padding: 10px 16px; display: flex; align-items: center; box-shadow: var(--glass-shadow), inset 0 0 15px rgba(0, 191, 255, 0.05); position: relative; transition: all 0.3s ease; }
    .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 25px rgba(0, 191, 255, 0.35); }
    
    .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; margin-right: 2px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s; flex-shrink: 0; }
    .icon-btn:hover { color: #ffffff; background: rgba(0, 191, 255, 0.15); }
    .icon-btn.recording { color: var(--error); background: rgba(255, 85, 85, 0.2); animation: pulseRec 1.5s infinite; }
    @keyframes pulseRec { 0% { transform: scale(1); } 50% { transform: scale(1.12); box-shadow: 0 0 15px rgba(255,85,85,0.5); } 100% { transform: scale(1); } }
    
    .image-preview-wrapper { display: none; position: absolute; bottom: 70px; left: 20px; background: #1c1d22; padding: 8px; border-radius: 14px; border: 1px solid var(--accent); box-shadow: 0 4px 20px rgba(0, 191, 255, 0.3); }
    .image-preview-wrapper img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; }
    .remove-image-btn { position: absolute; top: -6px; right: -6px; background: var(--error); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    textarea { flex-grow: 1; background: transparent; border: none; color: var(--text-main); resize: none; outline: none; font-family: inherit; font-size: 15px; max-height: 140px; line-height: 22px; padding: 6px 10px; margin: 0; user-select: text; -webkit-user-select: text; }
    
    .send-btn { background: linear-gradient(135deg, #00bfff, #9b51e0, #ff007f); border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; margin-left: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 15px rgba(0, 191, 255, 0.4); }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 0, 127, 0.6); }
    .send-btn svg { fill: #ffffff; width: 18px; height: 18px; }

    /* Modals & Overlay Lightbox */
    .lightbox-modal { display: none; position: fixed; top:0; left:0; width:100vw; height:100dvh; background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(12px); }
    .lightbox-modal img { max-width: 90vw; max-height: 90dvh; border-radius: 16px; border: 1px solid var(--accent); box-shadow: 0 0 40px rgba(0,191,255,0.5); }

    .profile-modal-overlay, .settings-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(5, 5, 8, 0.75); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(16px); }
    .profile-modal-card, .settings-modal-card { background: rgba(17, 20, 30, 0.9); border: 1px solid rgba(0, 191, 255, 0.35); border-radius: 28px; padding: 32px 28px; width: 420px; max-width: 90vw; text-align: center; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); position: relative; max-height: 85dvh; overflow-y: auto; }
    
    .profile-modal-card img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent); margin: 0 auto; object-fit: cover; }
    .profile-modal-name { color: #ffffff; font-size: 20px; font-weight: 600; margin: 0; }
    .profile-modal-email { color: var(--text-muted); font-size: 13px; margin: 0; padding-bottom: 10px; }
    .profile-sign-out-btn { background: #1c1d22; color: var(--error); border: 1px solid rgba(255,85,85,0.4); padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .profile-sign-out-btn:hover { background: var(--error); color: #ffffff; }
    .close-modal-btn { position: absolute; top: 14px; right: 18px; background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

    .settings-title { font-size: 22px; font-weight: 700; color: #ffffff; text-align: left; background: linear-gradient(90deg, #00bfff, #9b51e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    .settings-label { font-size: 14px; font-weight: 500; color: #e1e3e8; text-align: left; }
    .settings-toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .settings-toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #242834; transition: .3s; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .settings-section { margin-top: 10px; text-align: left; width: 100%; }
    .settings-section-title { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    .usage-bar-container { width: 100%; height: 10px; background: #242834; border-radius: 10px; overflow: hidden; margin: 6px 0 4px; }
    .usage-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00bfff, #ff007f); transition: width 0.4s ease; }
    .usage-text { font-size: 11px; color: var(--text-muted); text-align: right; }
    .settings-textarea { width: 100%; height: 70px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; padding: 10px; font-family: inherit; font-size: 12px; resize: none; outline: none; margin-bottom: 4px; }
    .settings-textarea:focus { border-color: var(--accent); }
    .settings-btn { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; text-align: center; margin-top: 6px; }
    .settings-btn:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }
    .settings-btn.danger { border-color: rgba(255, 85, 85, 0.4); color: #ff7777; }
    .settings-btn.danger:hover { background: rgba(255, 85, 85, 0.2); color: #ffffff; }

    .context-menu { display: none; position: fixed; background: rgba(20, 24, 36, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255, 85, 85, 0.4); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); z-index: 2000; flex-direction: column; padding: 6px; min-width: 160px; }
    .context-menu-item { padding: 12px 16px; color: var(--error); cursor: pointer; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; font-family: inherit; }
    .context-menu-item:hover { background: rgba(255, 85, 85, 0.2); }

    @media (max-width: 768px) { 
      .mobile-new-chat-btn { display: flex; }
      .history-sidebar { position: absolute; top: 0; left: 0; height: 100dvh; width: 300px; z-index: 100; transform: translateX(-100%); margin-left: 0; border-top-right-radius: 20px; border-bottom-right-radius: 20px; } 
      .history-sidebar.open { transform: translateX(0); } 
      .sidebar-close-btn { display: block; }
      .chat-container { padding: 80px 16px 20px; }
      .input-section { padding: 16px 16px 30px; }
      .profile-footer { border-bottom-right-radius: 20px; padding-bottom: 24px; }
      .header-action-btn.pwa-btn { display: flex; }
    }
  </style>
</head>
<body>

  <div class="dark-ambient-container"></div>

  <button class="menu-toggle-btn" aria-label="Toggle Menu" onclick="toggleSidebar(event)">☰</button>
  <button class="settings-toggle-btn" aria-label="Settings" onclick="openSettingsModal()" title="Settings">⚙️</button>
  
  <button class="mobile-new-chat-btn" aria-label="New Chat" onclick="startNewChat()">➕</button>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true" onclick="closeSidebar()"></div>

  <div class="history-sidebar" id="sidebarNode">
    <div class="sidebar-header">
      <button class="new-chat-btn" aria-label="Start a new chat" onclick="startNewChat(); closeSidebar();">
        <span>➕</span> New Chat

      <button class="header-action-btn" aria-label="Upgrade" onclick="openUpgradeModal()" title="Upgrade to Pro">⚡</button>
      
      <button class="header-action-btn pwa-btn" id="sidebarInstallBtn" aria-label="Install App" onclick="installPWA()" title="Install TruX App">📥</button>

      <button class="sidebar-close-btn" aria-label="Close sidebar" onclick="closeSidebar()" title="Close Menu">×</button>
    </div>
    
    <div class="history-list" id="historyList" role="list"></div>

    <div class="profile-footer" aria-label="User Profile" onclick="handleAuthAction()">
      <div class="profile-card" id="profileCard">
        <img class="profile-avatar" id="userAvatar" src="https://ui-avatars.com/api/?name=Guest+User&background=2a2b2d&color=fff" alt="User Avatar">
        <div class="profile-details">
          <div class="profile-name" id="userName">Guest User</div>
          <div class="profile-email" id="userEmail">Sign in required</div>
        </div>

  </div>

  <div class="main-chat-arena">
    <div class="welcome-screen" id="welcomeScreen">
      <h1 class="welcome-title">Welcome, I am Tru<span class="x-anim">X</span></h1>

    <div class="chat-container" id="chatContainer" role="log" aria-live="polite"></div>

    <div class="input-section">
      <div class="model-selector-simple">
        <select class="model-select" id="modelSelect" aria-label="Select AI Model" onchange="handleModelChange(this.value)">
          <option value="base">⚡ TruX Core 3.0</option>
          <option value="pro" id="proOption">✨ TruX Pro 3.0</option>
          <option value="nano-banana">🍌 Nano Banana Pro (Image Gen)</option>
          <option value="ultra" disabled>🔒 TruX Ultra 3.5 (paid)</option>

      <div class="input-wrapper">
        <div class="image-preview-wrapper" id="imagePreviewContainer">

        <button class="icon-btn" id="voiceBtn" aria-label="Voice Input" onclick="toggleVoiceInput()" title="Voice Input">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>

        <input type="file" id="imageUpload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        <button class="icon-btn" aria-label="Upload Image" onclick="document.getElementById('imageUpload').click()" title="Add Image">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
        
        <textarea id="promptInput" aria-label="Message Input" placeholder="Ask TruX anything or generate images with Nano Banana Pro..." rows="1" oninput="handleInputChange()"></textarea>
        
        <button class="send-btn" aria-label="Send Message" onclick="handleActionButton()" id="actionBtn">

  <div class="profile-modal-overlay" id="profileModal" aria-hidden="true">

        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Sign Out
      </button>
    </div>

  <div class="settings-modal-overlay" id="settingsModal" aria-hidden="true">
    <div class="settings-modal-card" role="dialog" aria-modal="true">
      <button class="close-modal-btn" aria-label="Close Settings" onclick="closeSettingsModal()">×</button>
      <div class="settings-title">Settings</div>
      
      <div class="settings-row">
        <span class="settings-label">Dark Mode / Ambient Glow</span>
        <label class="settings-toggle-switch">
          <input type="checkbox" id="neonGlowToggle" checked onchange="toggleAmbientGlow(this)">
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings-row">
        <span class="settings-label">Auto Read Answers</span>
        <label class="settings-toggle-switch">
          <input type="checkbox" id="autoReadToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings-row">
        <span class="settings-label">Sound Effects</span>
        <label class="settings-toggle-switch">
          <input type="checkbox" id="sfxToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">TruX Pro Usage (24h Limit)</div>
        <div class="usage-bar-container">
          <div class="usage-bar-fill" id="usageBarFill"></div>
        </div>
        <div class="usage-text" id="usageText">0 / 1,000 Tokens</div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Instructions for TruX</div>
        <textarea id="customInstructions" class="settings-textarea" placeholder="How would you like TruX to respond? (e.g. Keep answers concise, act like a senior developer)"></textarea>
        <button class="settings-btn" onclick="saveCustomInstructions()">Save Instructions</button>

      <div class="settings-section">
        <div class="settings-section-title">System & Tools</div>
        <button class="settings-btn" onclick="checkApiLatency()">📡 Check API Status</button>
        <button class="settings-btn" onclick="exportChatData()">📥 Export Chat Backup</button>
        <button class="settings-btn danger" onclick="resetAllSettings()">🔄 Reset All Settings to Default</button>
        <button class="settings-btn danger" onclick="clearAllHistory()">🗑️ Clear All Chat History</button>

  <div class="context-menu" id="contextMenu">
    <div class="context-menu-item" id="contextMenuDeleteBtn">
      <span>🗑️</span> Delete Chat
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker Registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('sidebarInstallBtn');
      if (installBtn) installBtn.style.display = 'flex';
    });

    async function installPWA() {
      if (!deferredPrompt) {
        alert("PWA installation is either completed or not supported on this browser.");
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        const installBtn = document.getElementById('sidebarInstallBtn');
        if (installBtn) installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    }

    let auth = null;
    let provider = null;

    async function initFirebase() {
      const fallbackConfig = {
        apiKey: "AIzaSyAs_GDrzlBaucHfiff0Y6cA8GVHjFTA62Q",
        authDomain: "trux-ai.firebaseapp.com",
        projectId: "trux-ai",
        storageBucket: "trux-ai.firebasestorage.app",
        messagingSenderId: "59313097411",
        appId: "1:59313097411:web:32e4158bfb733fa7cfb076",
        measurementId: "G-C32LC29QHC"
      };

      try {
        const res = await fetch('/api/firebase-config');
        const config = await res.json();
        firebase.initializeApp(config);
      } catch (err) {
        firebase.initializeApp(fallbackConfig);
      }
      
      auth = firebase.auth();
      provider = new firebase.auth.GoogleAuthProvider();

      auth.onAuthStateChanged(user => {
        if (user) {
          document.getElementById('userName').innerText = user.displayName;
          document.getElementById('userEmail').innerText = user.email;
          document.getElementById('userAvatar').src = user.photoURL;
        } else {
          document.getElementById('userName').innerText = 'Guest User';
          document.getElementById('userEmail').innerText = 'Sign in required';
          document.getElementById('userAvatar').src = 'https://ui-avatars.com/api/?name=Guest+User&background=2a2b2d&color=fff';
        }
      });
    }
    initFirebase();

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxModal').style.display = 'flex';
    }
    function closeLightbox() {
      document.getElementById('lightboxModal').style.display = 'none';
    }

    function getProUsageData() {
      const now = Date.now();
      let usage = JSON.parse(localStorage.getItem('trux_pro_usage')) || { tokensUsed: 0, resetTimestamp: now + 86400000 };
      if (now > usage.resetTimestamp) {
        usage = { tokensUsed: 0, resetTimestamp: now + 86400000 };
        localStorage.setItem('trux_pro_usage', JSON.stringify(usage));
      }
      return usage;
    }

    function updateProUsageUI() {
      const usage = getProUsageData();
      const fillPercent = Math.min(100, (usage.tokensUsed / 1000) * 100);
      const fillEl = document.getElementById('usageBarFill');
      const textEl = document.getElementById('usageText');
      const proOption = document.getElementById('proOption');

      if (fillEl) fillEl.style.width = fillPercent + '%';
      if (textEl) textEl.innerText = `${usage.tokensUsed.toLocaleString()} / 1,000 Tokens`;

      if (usage.tokensUsed >= 1000) {
        if (proOption) {
          proOption.disabled = true;
          proOption.innerText = "🔒 TruX Pro 3.0 (24h Limit)";
        }
        if (currentModel === 'pro') {
          currentModel = 'base';
          document.getElementById('modelSelect').value = 'base';
        }
      } else {
        if (proOption) {
          proOption.disabled = false;
          proOption.innerText = "✨ TruX Pro 3.0";
        }
      }
    }

    function recordProTokens(tokens) {
      let usage = getProUsageData();
      usage.tokensUsed = Math.min(1000, usage.tokensUsed + tokens);
      localStorage.setItem('trux_pro_usage', JSON.stringify(usage));
      updateProUsageUI();
    }

    function saveCustomInstructions() {
      const text = document.getElementById('customInstructions').value.trim();
      localStorage.setItem('trux_custom_instructions', text);
      alert("Instructions saved successfully!");
    }

    function loadCustomInstructions() {
      const saved = localStorage.getItem('trux_custom_instructions') || '';
      const input = document.getElementById('customInstructions');
      if (input) input.value = saved;
    }

    function exportChatData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chatSessions, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `trux_chat_backup_${Date.now()}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function checkApiLatency() {
      const start = Date.now();
      fetch('/api/chat')
        .then(() => alert(`API Connection Healthy! Latency: ${Date.now() - start}ms`))
        .catch(() => alert("Failed to connect to backend server."));
    }

    function resetAllSettings() {
      if (confirm("Reset all settings to default configuration?")) {
        localStorage.removeItem('trux_custom_instructions');
        localStorage.removeItem('trux_ambient_glow');
        localStorage.removeItem('trux_auto_read');
        localStorage.removeItem('trux_sfx');
        loadSettingsFromStorage();
        alert("Settings reset to defaults.");
      }
    }

    function clearAllHistory() {
      if (confirm("Are you sure you want to permanently clear all chat history?")) {
        chatSessions = {};
        localStorage.removeItem('trux_chats');
        startNewChat();
        closeSettingsModal();
      }
    }

    function handleAuthAction() {
      if (!auth) return;
      if (!auth.currentUser) {
        auth.signInWithPopup(provider).catch(console.error);
      } else {
        document.getElementById('modalAvatar').src = auth.currentUser.photoURL;
        document.getElementById('modalName').innerText = auth.currentUser.displayName;
        document.getElementById('modalEmail').innerText = auth.currentUser.email;
        document.getElementById('profileModal').style.display = 'flex';
      }
    }

    function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }
    function openSettingsModal() { updateProUsageUI(); loadCustomInstructions(); document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }
    function openUpgradeModal() { alert("⚡ TruX Pro Features:\n• TruX 3.5 Faster Processing\n• Extended Context Window\n• Priority Server Routing"); }

    function toggleAmbientGlow(el) {
      const ambient = document.querySelector('.dark-ambient-container');
      const isChecked = el ? el.checked : document.getElementById('neonGlowToggle').checked;
      if (ambient) ambient.style.display = isChecked ? 'block' : 'none';
      if (!isChecked) {
        document.body.classList.add('dark-mode-off');
      } else {
        document.body.classList.remove('dark-mode-off');
      }
      localStorage.setItem('trux_ambient_glow', isChecked ? 'true' : 'false');
    }

    function loadSettingsFromStorage() {
      const glow = localStorage.getItem('trux_ambient_glow');
      const isGlowOn = glow === null ? true : glow === 'true';
      const glowToggle = document.getElementById('neonGlowToggle');
      if (glowToggle) {
        glowToggle.checked = isGlowOn;
        toggleAmbientGlow(glowToggle);
      }
    }

    function confirmSignOut() { auth.signOut().then(() => closeProfileModal()); }

    function isUserSignedIn() { return auth && !!auth.currentUser; }

    function handleModelChange(val) {
      if (val === 'ultra') {
        alert("TruX Ultra 3.6 is currently locked.");
        document.getElementById('modelSelect').value = currentModel;
        return;
      }
      if (val === 'pro') {
        const usage = getProUsageData();
        if (usage.tokensUsed >= 1000) {
          alert("TruX Pro limit reached (1k tokens). Resets in 24 hours.");
          document.getElementById('modelSelect').value = currentModel;
          return;
        }
      }
      currentModel = val;
    }

    let chatSessions = JSON.parse(localStorage.getItem('trux_chats')) || {};
    let currentChatId = null;
    let isGenerating = false;
    let activeAbortController = null;
    let currentModel = 'base';
    let selectedImageBase64 = null;
    let wasInputByVoice = false;
    let codeBlockCounter = 0;
    let contextMenuTargetId = null;

    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        wasInputByVoice = true;
        document.getElementById('voiceBtn').classList.add('recording');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        const inputEl = document.getElementById('promptInput');
        inputEl.value = transcript;
        inputEl.style.height = "auto";
        inputEl.style.height = (inputEl.scrollHeight) + "px";
        handleInputChange();
      };

      recognition.onerror = () => stopVoiceInput();
      recognition.onend = () => stopVoiceInput();
    }

    function toggleVoiceInput() {
      if (!recognition) {
        alert("Speech recognition is not supported in this browser. Try Chrome.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        wasInputByVoice = true;
        recognition.start();
      }
    }

    function stopVoiceInput() {
      isRecording = false;
      document.getElementById('voiceBtn').classList.remove('recording');
    }

    function handleInputChange() {
      const inputEl = document.getElementById('promptInput');
      inputEl.style.height = "auto";
      inputEl.style.height = (inputEl.scrollHeight) + "px";
    }

    function copyCodeToClipboard(button, codeId) {
      const codeElement = document.getElementById(codeId);
      if (!codeElement) return;
      navigator.clipboard.writeText(codeElement.innerText).then(() => {
        const orig = button.innerText;
        button.innerText = "Copied! ✓";
        setTimeout(() => button.innerText = orig, 2000);
      });
    }

    function renderFormattedText(text) {
      if (!text) return "";
      let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      // Render Images from markdown ![alt](url)
      html = html.replace(/!\[(.*?)\]\((data:image\/[^;]+;base64,[^\s\)]+|https?:\/\/[^\s\)]+)\)/g, (match, alt, src) => {
        return `<div class="generated-image-card">
          <img src="${src}" alt="${alt}" class="generated-img" onclick="openLightbox('${src}')"/>
          <div class="image-card-actions">
            <a href="${src}" download="nano-banana-pro.jpg" class="img-download-btn">📥 Download Image</a>
          </div>
        </div>`;
      });

      // Render Code Blocks
      html = html.replace(/```([\s\S]*?)```/g, (match, p1) => {
        codeBlockCounter++;
        const codeId = 'code_block_' + codeBlockCounter + '_' + Date.now();
        return `<div class="code-block-wrapper"><div class="code-header"><span>Code</span><button class="copy-code-btn" onclick="copyCodeToClipboard(this, '${codeId}')">📋 Copy</button></div><pre><code id="${codeId}">${p1.trim()}</code></pre></div>`;
      });

      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      html = html.replace(/\*(.*?)\*/g, '<i>$1</i>');
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    function stripMarkdownForVoice(text) {
      return text ? text.replace(/```[\s\S]*?```/g, 'Code block omitted.').replace(/\!\s*\[.*?\]\(.*?\)/g, 'Image outputted.').replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1').replace(/#/g, '').replace(/`/g, '') : "";
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(stripMarkdownForVoice(text));
      window.speechSynthesis.speak(utterance);
    }

    function toggleSidebar(e) {
      if (e) e.stopPropagation();
      const sidebar = document.getElementById('sidebarNode');
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('open');
        document.getElementById('sidebarOverlay').style.display = sidebar.classList.contains('open') ? 'block' : 'none';
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebarNode');
      if (window.innerWidth <= 768) {
        sidebar.classList.remove('open');
        document.getElementById('sidebarOverlay').style.display = 'none';
      } else {
        sidebar.classList.add('collapsed');
      }
    }

    function startNewChat() {
      if (activeAbortController) activeAbortController.abort();
      document.getElementById('chatContainer').innerHTML = '';
      document.getElementById('chatContainer').style.display = 'none';
      document.getElementById('welcomeScreen').style.display = 'flex';
      document.body.classList.remove('chat-active');
      currentChatId = null;
      removeImage();
      renderSidebar();
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        selectedImageBase64 = e.target.result;
        document.getElementById('imagePreview').src = selectedImageBase64;
        document.getElementById('imagePreviewContainer').style.display = 'block';
        handleInputChange();
      };
      reader.readAsDataURL(file);
    }
    
    function removeImage() {
      selectedImageBase64 = null;
      document.getElementById('imageUpload').value = '';
      document.getElementById('imagePreviewContainer').style.display = 'none';
      handleInputChange();
    }

    const sendIconSvg = `<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>`;
    const stopIconSvg = `<rect x="6" y="6" width="12" height="12" rx="1.5" />`;

    async function retryPrompt(promptToRetry, targetRow) {
      if (targetRow) targetRow.remove();
      const inputEl = document.getElementById('promptInput');
      inputEl.value = promptToRetry;
      handleInputChange();
      sendPrompt();
    }

    async function sendPrompt() {
      const inputEl = document.getElementById('promptInput');
      const prompt = inputEl.value.trim();
      if (!prompt && !selectedImageBase64) return;

      if (currentModel === 'pro') {
        const usage = getProUsageData();
        if (usage.tokensUsed >= 1000) {
          alert("TruX Pro token limit reached for 24 hours. Switching to Core model.");
          currentModel = 'base';
          document.getElementById('modelSelect').value = 'base';
        }
      }

      isGenerating = true;
      document.getElementById('btnIcon').innerHTML = stopIconSvg;
      document.body.classList.add('chat-active');

      const currentVoiceTriggered = wasInputByVoice;
      wasInputByVoice = false;

      if (!currentChatId) {
        currentChatId = 'chat_' + Date.now();
        chatSessions[currentChatId] = { title: prompt ? prompt.substring(0, 24) : 'Image Query', messages: [] };
      }
      
      chatSessions[currentChatId].messages.push({ role: 'user', text: prompt });
      localStorage.setItem('trux_chats', JSON.stringify(chatSessions));

      document.getElementById('welcomeScreen').style.display = 'none';
      const container = document.getElementById('chatContainer');
      container.style.display = 'block';

      appendMessageRow('You', prompt + (selectedImageBase64 ? '\n[Image Attached]' : ''), 'user-row', 'user-bubble');

      inputEl.value = '';
      renderSidebar();

      const imageToSend = selectedImageBase64;
      removeImage();
      handleInputChange();

      const bubbleId = 'bubble_' + Date.now();
      const actionsId = 'actions_' + Date.now();
      const statusTextId = 'status_' + Date.now();

      const truxRow = document.createElement('div');
      truxRow.className = 'message-row trux-row';
      truxRow.innerHTML = `
        <div class="message-label">TruX AI</div>
        <div class="bubble trux-bubble thinking-box" id="${bubbleId}">
          <div class="thinking-loader-container">
            <div class="thinking-dots">
              <div class="thinking-dot dot-1"></div>
              <div class="thinking-dot dot-2"></div>
              <div class="thinking-dot dot-3"></div>
            </div>
            <span class="thinking-status-text" id="${statusTextId}">${currentModel === 'nano-banana' ? 'Generating Image with Nano Banana Pro...' : 'Thinking...'}</span>
          </div>
        </div>
        <div class="message-actions" id="${actionsId}"></div>`;
      
      container.appendChild(truxRow);
      container.scrollTop = container.scrollHeight;

      const phrases = currentModel === 'nano-banana' 
        ? ["Rendering graphics...", "Applying neural filters...", "Finalizing image details..."]
        : ["Thinking...", "Processing query...", "Analyzing context...", "Formulating response..."];
      let phraseIdx = 0;
      const phraseInterval = setInterval(() => {
        phraseIdx = (phraseIdx + 1) % phrases.length;
        const statusEl = document.getElementById(statusTextId);
        if (statusEl) statusEl.innerText = phrases[phraseIdx];
      }, 1800);

      activeAbortController = new AbortController();

      try {
        const customInstructions = localStorage.getItem('trux_custom_instructions') || '';
        const historyPayload = chatSessions[currentChatId].messages.slice(0, -1).slice(-10);

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: activeAbortController.signal,
          body: JSON.stringify({ 
            message: prompt, 
            tier: currentModel, 
            history: historyPayload, 
            image: imageToSend,
            systemInstruction: customInstructions
          })
        });
        
        clearInterval(phraseInterval);
        const data = await res.json();
        const responseText = data.reply || data.error || "No response received.";
        chatSessions[currentChatId].messages.push({ role: 'trux', text: responseText });
        localStorage.setItem('trux_chats', JSON.stringify(chatSessions));

        if (currentModel === 'pro') {
          const estimatedTokens = Math.ceil((prompt.length + responseText.length) / 4);
          recordProTokens(estimatedTokens);
        }

        const bubble = document.getElementById(bubbleId);
        bubble.classList.remove('thinking-box');
        bubble.innerHTML = `<div class="fade-in-text">${renderFormattedText(responseText)}</div>`;
        
        const actionsContainer = document.getElementById(actionsId);
        const readBtn = document.createElement('button');
        readBtn.className = 'read-aloud-btn';
        readBtn.innerHTML = '🔊 Read Aloud';
        readBtn.onclick = () => speakText(responseText);
        actionsContainer.appendChild(readBtn);

        isGenerating = false;
        activeAbortController = null;
        document.getElementById('btnIcon').innerHTML = sendIconSvg;
        container.scrollTop = container.scrollHeight;
        handleInputChange();

        if (currentVoiceTriggered || document.getElementById('autoReadToggle').checked) {
          speakText(responseText);
        }
      } catch (err) {
        clearInterval(phraseInterval);
        const bubble = document.getElementById(bubbleId);
        if (bubble) {
          bubble.classList.remove('thinking-box');
          bubble.innerText = err.name === 'AbortError' ? "Generation stopped." : "Error connecting to TruX server.";
        }
        
        const actionsContainer = document.getElementById(actionsId);
        actionsContainer.innerHTML = '';
        const retryBtn = document.createElement('button');
        retryBtn.className = 'retry-btn';
        retryBtn.innerHTML = '🔄 Retry';
        retryBtn.onclick = () => retryPrompt(prompt, truxRow);
        actionsContainer.appendChild(retryBtn);

        isGenerating = false;
        activeAbortController = null;
        document.getElementById('btnIcon').innerHTML = sendIconSvg;
        handleInputChange();
      }
    }

    function appendMessageRow(label, text, rowClass, bubbleClass) {
      const container = document.getElementById('chatContainer');
      const row = document.createElement('div');
      row.className = `message-row ${rowClass}`;
      row.innerHTML = `<div class="message-label">${label}</div><div class="bubble ${bubbleClass}">${renderFormattedText(text)}</div>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function handleActionButton() {
      if (isGenerating) {
        if (activeAbortController) activeAbortController.abort();
        isGenerating = false;
        document.getElementById('btnIcon').innerHTML = sendIconSvg;
        handleInputChange();
      } else {
        if (currentModel === 'pro' && !isUserSignedIn()) {
          alert("Please sign in to access Pro model.");
          handleAuthAction();
          return; 
        }
        sendPrompt();
      }
    }

    function deleteChat(id) {
      if(confirm("Are you sure you want to delete this chat?")) {
        delete chatSessions[id];
        localStorage.setItem('trux_chats', JSON.stringify(chatSessions));
        if(currentChatId === id) startNewChat();
        else renderSidebar();
      }
    }

    function renderSidebar() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      Object.keys(chatSessions).reverse().forEach(id => {
        const wrapper = document.createElement('div');
        wrapper.className = `history-item-wrapper ${id === currentChatId ? 'active' : ''}`;
        
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerText = chatSessions[id].title;
        item.onclick = () => loadChatSession(id);

        wrapper.oncontextmenu = (e) => {
          e.preventDefault();
          contextMenuTargetId = id;
          const menu = document.getElementById('contextMenu');
          menu.style.display = 'flex';
          menu.style.top = e.clientY + 'px';
          menu.style.left = e.clientX + 'px';
        };

        wrapper.appendChild(item);
        list.appendChild(wrapper);
      });
    }

    document.getElementById('contextMenuDeleteBtn').onclick = () => {
      if (contextMenuTargetId) {
        deleteChat(contextMenuTargetId);
        contextMenuTargetId = null;
        document.getElementById('contextMenu').style.display = 'none';
      }
    };

    window.addEventListener('click', () => {
      document.getElementById('contextMenu').style.display = 'none';
    });

    function loadChatSession(id) {
      if (activeAbortController) activeAbortController.abort();
      currentChatId = id;
      document.body.classList.add('chat-active');
      document.getElementById('welcomeScreen').style.display = 'none';
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      container.style.display = 'block';

      chatSessions[id].messages.forEach((msg, index) => {
        const rowClass = msg.role === 'user' ? 'user-row' : 'trux-row';
        const bubbleClass = msg.role === 'user' ? 'user-bubble' : 'trux-bubble';
        const label = msg.role === 'user' ? 'You' : 'TruX AI';
        
        const row = document.createElement('div');
        row.className = `message-row ${rowClass}`;
        let innerHTML = `<div class="message-label">${label}</div><div class="bubble ${bubbleClass}">${renderFormattedText(msg.text)}</div>`;
        
        if (msg.role === 'trux') {
          const actionId = 'history_action_' + id + '_' + index;
          innerHTML += `<div class="message-actions" id="${actionId}"></div>`;
          row.innerHTML = innerHTML;
          container.appendChild(row);
          
          const actContainer = document.getElementById(actionId);
          const readBtn = document.createElement('button');
          readBtn.className = 'read-aloud-btn';
          readBtn.innerHTML = '🔊 Read Aloud';
          readBtn.onclick = () => speakText(msg.text);
          actContainer.appendChild(readBtn);
        } else {
          row.innerHTML = innerHTML;
          container.appendChild(row);
        }
      });
      container.scrollTop = container.scrollHeight;
      renderSidebar();
      if (window.innerWidth <= 768) closeSidebar();
    }

    const tx = document.getElementById('promptInput');
    tx.addEventListener("keydown", function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleActionButton(); }
    });

    renderSidebar();
    updateProUsageUI();
    loadSettingsFromStorage();
    handleInputChange();
  </script>
</body>
</html>
