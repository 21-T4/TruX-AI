<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TruX AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#06070b;
  --panel:#10131c;
  --panel2:#171b27;
  --border:rgba(255,255,255,.11);
  --text:#f5f7fb;
  --muted:#8b94aa;
  --cyan:#00e5ff;
  --purple:#9b5cff;
  --danger:#ff6b6b;
}

body{
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 10% 10%,rgba(0,229,255,.08),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(155,92,255,.08),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
select,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  display:flex;
}

.sidebar{
  width:280px;
  height:100%;
  flex-shrink:0;
  background:rgba(12,15,23,.92);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:.25s;
  z-index:20;
}

.sidebar.closed{
  margin-left:-280px;
}

.sidebar-top{
  padding:14px;
  border-bottom:1px solid var(--border);
}

.new-chat{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
  font-weight:bold;
  margin-bottom:10px;
}

.new-chat:hover{
  border-color:var(--cyan);
}

.search{
  width:100%;
  padding:10px;
  border-radius:10px;
  background:#080a10;
  border:1px solid var(--border);
  color:white;
  outline:none;
}

.tools{
  padding:12px;
  border-bottom:1px solid var(--border);
}

.tool{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:#ddd;
  text-align:left;
}

.tool.active{
  border-color:var(--cyan);
  color:var(--cyan);
}

select.tool{
  outline:none;
}

.history{
  flex:1;
  overflow:auto;
  padding:10px;
}

.history-item{
  padding:10px;
  margin-bottom:4px;
  border-radius:9px;
  color:#cdd3df;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}

.history-item:hover,
.history-item.active{
  background:rgba(255,255,255,.07);
  color:white;
}

.sidebar-bottom{
  padding:12px;
  border-top:1px solid var(--border);
}

.account{
  padding:11px;
  border:1px solid var(--border);
  border-radius:11px;
  color:#ddd;
  background:var(--panel2);
  width:100%;
  text-align:left;
}

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

.nav{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--border);
  background:rgba(10,12,18,.75);
}

.nav-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon{
  width:38px;
  height:38px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
}

.model{
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
  padding:9px 12px;
  border-radius:10px;
  outline:none;
}

.welcome{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.welcome.hidden{
  display:none;
}

.welcome h1{
  font-size:clamp(30px,6vw,48px);
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
}

.chat{
  flex:1;
  overflow:auto;
  padding:25px 15px;
  display:none;
}

.chat.visible{
  display:block;
}

.message{
  max-width:850px;
  width:100%;
  margin:0 auto 22px;
}

.label{
  font-size:11px;
  font-weight:bold;
  color:var(--cyan);
  margin-bottom:7px;
  text-transform:uppercase;
}

.user .label{
  text-align:right;
  color:var(--muted);
}

.bubble{
  padding:15px 18px;
  border-radius:17px;
  line-height:1.6;
  font-size:15px;
  overflow-wrap:anywhere;
}

.user .bubble{
  margin-left:auto;
  width:max-content;
  max-width:85%;
  background:var(--panel2);
  border:1px solid var(--border);
}

.ai .bubble{
  background:rgba(16,19,28,.8);
  border:1px solid var(--border);
}

.ai img{
  display:block;
  max-width:100%;
  margin-top:12px;
  border-radius:13px;
}

.thinking{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 13px;
  border:1px solid rgba(0,229,255,.3);
  border-radius:20px;
  color:var(--cyan);
  font-size:13px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--cyan);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.25;transform:scale(.7)}
}

.code{
  margin:12px 0;
  background:#050609;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}

.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 10px;
  color:var(--muted);
  font-size:11px;
  border-bottom:1px solid var(--border);
}

.code button{
  border:1px solid var(--border);
  background:#151923;
  color:white;
  padding:4px 8px;
  border-radius:6px;
}

pre{
  padding:13px;
  overflow:auto;
}

code{
  font-family:monospace;
}

.inline-code{
  background:rgba(255,255,255,.08);
  padding:2px 5px;
  border-radius:4px;
}

.sources{
  margin-top:14px;
  padding-top:10px;
  border-top:1px solid var(--border);
}

.sources a{
  display:block;
  color:var(--cyan);
  margin-top:5px;
  text-decoration:none;
  font-size:13px;
}

.input-area{
  padding:12px 15px 16px;
  flex-shrink:0;
}

.input-box{
  max-width:850px;
  margin:auto;
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(12,15,23,.92);
  padding:9px;
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:5px;
}

textarea{
  flex:1;
  resize:none;
  max-height:150px;
  background:transparent;
  color:white;
  border:0;
  outline:0;
  padding:8px;
  line-height:22px;
}

.action{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#a8b0c1;
}

.action:hover{
  background:rgba(255,255,255,.08);
  color:white;
}

.send{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:white;
  color:black;
  font-weight:bold;
}

.send:disabled{
  opacity:.4;
}

.attachment{
  display:none;
  padding:7px 10px;
  color:var(--cyan);
  font-size:12px;
  border-bottom:1px solid var(--border);
}

.attachment.show{
  display:block;
}

.disclaimer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:600px;
  max-width:100%;
  max-height:90dvh;
  overflow:auto;
  background:#10131c;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}

.modal h2{
  margin-bottom:18px;
}

.modal textarea{
  display:block;
  width:100%;
  height:130px;
  background:#080a10;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  margin-bottom:12px;
}

.modal button{
  padding:10px 14px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
  margin-right:7px;
}

@media(max-width:700px){
  .sidebar{
    position:fixed;
    left:0;
    top:0;
    box-shadow:10px 0 40px #000;
  }

  .sidebar.closed{
    margin-left:0;
    transform:translateX(-100%);
  }

  .user .bubble{
    max-width:90%;
  }

  .model{
    max-width:160px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-top">
      <button class="new-chat" id="newChatBtn">
        ＋ New Chat
      </button>

      <input
        class="search"
        id="searchChats"
        placeholder="Search chats..."
      >
    </div>

    <div class="tools">

      <button class="tool" id="imageBtn">
        🎨 Image Generation: OFF
      </button>

      <select class="tool" id="thinking">
        <option value="off">Reasoning: Off</option>
        <option value="low">Reasoning: Low</option>
        <option value="medium" selected>Reasoning: Medium</option>
        <option value="high">Reasoning: High</option>
      </select>

    </div>

    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <button class="account" id="settingsBtn">
        ⚙️ Settings
      </button>
    </div>

  </aside>

  <main class="main">

    <header class="nav">

      <div class="nav-left">
        <button class="icon" id="menuBtn">☰</button>

        <select class="model" id="model">
          <option value="base">TruX-Core 3.7</option>
          <option value="pro">TruX-Pro</option>
        </select>
      </div>

      <button class="icon" id="topSettings">⚙</button>

    </header>

    <section class="welcome" id="welcome">
      <h1>What can I help with today?</h1>
      <p>TruX AI</p>
    </section>

    <section class="chat" id="chat"></section>

    <div class="input-area">

      <div class="input-box">

        <div class="attachment" id="attachment">
          📎 Image attached
        </div>

        <div class="input-row">

          <input
            type="file"
            id="file"
            accept="image/*"
            hidden
          >

          <input
            type="file"
            id="camera"
            accept="image/*"
            capture="environment"
            hidden
          >

          <button class="action" id="attachBtn" title="Attach image">
            📎
          </button>

          <button class="action" id="cameraBtn" title="Camera">
            📷
          </button>

          <button class="action" id="micBtn" title="Voice">
            🎙
          </button>

          <textarea
            id="input"
            rows="1"
            placeholder="Message TruX..."
          ></textarea>

          <button class="send" id="sendBtn">
            ➤
          </button>

        </div>

      </div>

      <div class="disclaimer">
        TruX AI can make mistakes. Verify important information.
      </div>

    </div>

  </main>

</div>

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>TruX Settings</h2>

    <p style="color:#8b94aa;margin-bottom:8px">
      Custom instructions
    </p>

    <textarea
      id="instructions"
      placeholder="Example: Be concise and focus on JavaScript."
    ></textarea>

    <button id="saveInstructions">
      Save
    </button>

    <button id="clearChats">
      Clear Chats
    </button>

    <button id="closeModal">
      Close
    </button>

  </div>

</div>

<script>
"use strict";

/* =========================
   STATE
========================= */

const STORAGE_CHATS = "trux_chats_v2";
const STORAGE_INSTRUCTIONS = "trux_instructions_v2";

let chats = {};
let currentChatId = null;
let imageMode = false;
let selectedImage = null;
let thinkingLevel = "medium";
let modelTier = "base";
let controller = null;

/* =========================
   ELEMENTS
========================= */

const $ = id => document.getElementById(id);

const sidebar = $("sidebar");
const welcome = $("welcome");
const chatEl = $("chat");
const input = $("input");
const sendBtn = $("sendBtn");
const historyEl = $("history");
const imageBtn = $("imageBtn");
const fileInput = $("file");
const cameraInput = $("camera");
const attachment = $("attachment");
const modal = $("modal");
const instructions = $("instructions");

/* =========================
   STORAGE
========================= */

function loadStorage(){

  try{
    chats =
      JSON.parse(
        localStorage.getItem(STORAGE_CHATS)
      ) || {};
  }catch{
    chats = {};
  }

  instructions.value =
    localStorage.getItem(STORAGE_INSTRUCTIONS) || "";

  renderHistory();
}

function saveChats(){
  localStorage.setItem(
    STORAGE_CHATS,
    JSON.stringify(chats)
  );
}

/* =========================
   SIDEBAR
========================= */

$("menuBtn").onclick = () => {
  sidebar.classList.toggle("closed");
};

$("newChatBtn").onclick = newChat;

function newChat(){

  if(controller){
    controller.abort();
    controller = null;
  }

  currentChatId = null;

  chatEl.innerHTML = "";
  chatEl.classList.remove("visible");
  welcome.classList.remove("hidden");

  selectedImage = null;
  attachment.classList.remove("show");

  renderHistory();
}

function renderHistory(filter = ""){

  historyEl.innerHTML = "";

  const ids = Object.keys(chats).reverse();

  const query = filter.toLowerCase();

  let found = false;

  for(const id of ids){

    const item = chats[id];

    if(
      query &&
      !String(item.title || "")
        .toLowerCase()
        .includes(query)
    ){
      continue;
    }

    found = true;

    const el = document.createElement("div");

    el.className =
      "history-item" +
      (id === currentChatId ? " active" : "");

    el.textContent =
      item.title || "New Chat";

    el.onclick = () => loadChat(id);

    historyEl.appendChild(el);
  }

  if(!found){

    const empty =
      document.createElement("div");

    empty.style.color = "#8b94aa";
    empty.style.padding = "12px";
    empty.textContent = "No chats";

    historyEl.appendChild(empty);
  }
}

$("searchChats").oninput = e => {
  renderHistory(e.target.value);
};

/* =========================
   MODEL / THINKING
========================= */

$("model").onchange = e => {
  modelTier = e.target.value;
};

$("thinking").onchange = e => {
  thinkingLevel = e.target.value;
};

/* =========================
   IMAGE MODE
========================= */

imageBtn.onclick = () => {

  imageMode = !imageMode;

  imageBtn.classList.toggle(
    "active",
    imageMode
  );

  imageBtn.textContent =
    imageMode
      ? "🎨 Image Generation: ON"
      : "🎨 Image Generation: OFF";
};

/* =========================
   IMAGE UPLOAD
========================= */

$("attachBtn").onclick = () =>
  fileInput.click();

$("cameraBtn").onclick = () =>
  cameraInput.click();

fileInput.onchange = handleImage;
cameraInput.onchange = handleImage;

function handleImage(event){

  const file = event.target.files?.[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){

    alert("Please select an image.");

    event.target.value = "";

    return;
  }

  const reader = new FileReader();

  reader.onload = e => {

    selectedImage = e.target.result;

    attachment.textContent =
      "📎 " + file.name;

    attachment.classList.add("show");
  };

  reader.onerror = () => {
    alert("Could not read image.");
  };

  reader.readAsDataURL(file);
}

/* =========================
   TEXTAREA
========================= */

input.oninput = () => {

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight,150) + "px";
};

input.onkeydown = e => {

  if(
    e.key === "Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    sendMessage();
  }
};

sendBtn.onclick = sendMessage;

/* =========================
   CHAT CREATION
========================= */

function ensureChat(message){

  if(currentChatId) return;

  currentChatId =
    "chat_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,7);

  chats[currentChatId] = {

    title:
      message
        ? message.slice(0,35)
        : "Image generation",

    messages: []

  };

  saveChats();
}

/* =========================
   ADD USER MESSAGE
========================= */

function addUserMessage(text){

  const row =
    document.createElement("div");

  row.className = "message user";

  const label =
    document.createElement("div");

  label.className = "label";
  label.textContent = "You";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent =
    text || "Image";

  row.appendChild(label);
  row.appendChild(bubble);

  chatEl.appendChild(row);

  scrollBottom();
}

/* =========================
   THINKING
========================= */

function addThinking(){

  const row =
    document.createElement("div");

  row.className = "message ai";
  row.id = "thinkingMessage";

  row.innerHTML = `
    <div class="label">TruX AI</div>
    <div class="thinking">
      <span class="dot"></span>
      <span>Thinking...</span>
    </div>
  `;

  chatEl.appendChild(row);

  scrollBottom();

  return row;
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const message =
    input.value.trim();

  if(!message && !selectedImage){

    return;
  }

  sendBtn.disabled = true;

  ensureChat(message);

  chats[currentChatId].messages.push({
    role:"user",
    text:message
  });

  saveChats();

  welcome.classList.add("hidden");
  chatEl.classList.add("visible");

  addUserMessage(message);

  const imageForRequest =
    selectedImage;

  input.value = "";
  input.style.height = "auto";

  selectedImage = null;

  attachment.classList.remove("show");

  const isImage =
    imageMode;

  imageMode = false;

  imageBtn.classList.remove("active");
  imageBtn.textContent =
    "🎨 Image Generation: OFF";

  const thinking =
    addThinking();

  controller =
    new AbortController();

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        signal:
          controller.signal,

        body:JSON.stringify({

          message,

          history:
            chats[currentChatId]
              .messages
              .slice(0,-1)
              .slice(-10),

          image:
            imageForRequest,

          tier:
            modelTier,

          thinkingLevel,

          systemInstruction:
            localStorage.getItem(
              STORAGE_INSTRUCTIONS
            ) || "",

          mode:
            isImage
              ? "image"
              : "chat"
        })
      });

    let data;

    try{
      data = await response.json();
    }catch{
      throw new Error(
        "Server returned invalid JSON."
      );
    }

    if(!response.ok){

      throw new Error(
        data?.error ||
        `Server error ${response.status}`
      );
    }

    thinking.remove();

    if(isImage){

      renderImageResponse(data);

    }else{

      renderAIResponse(data);

    }

  }catch(error){

    if(error.name === "AbortError"){
      thinking.remove();
      return;
    }

    thinking.remove();

    renderError(
      error.message ||
      "Unable to connect to TruX."
    );

  }finally{

    sendBtn.disabled = false;
    controller = null;

  }
}

/* =========================
   AI RESPONSE
========================= */

function renderAIResponse(data){

  const text =
    data.reply ||
    "No response generated.";

  chats[currentChatId].messages.push({
    role:"trux",
    text
  });

  saveChats();

  const row =
    document.createElement("div");

  row.className = "message ai";

  row.innerHTML = `
    <div class="label">TruX AI</div>
    <div class="bubble">
      ${formatText(text)}
    </div>
  `;

  chatEl.appendChild(row);

  if(
    Array.isArray(data.sources) &&
    data.sources.length
  ){

    const sources =
      document.createElement("div");

    sources.className = "sources";

    sources.innerHTML =
      "<b>Sources</b>";

    const unique =
      new Set();

    data.sources.forEach(source => {

      if(
        !source.url ||
        unique.has(source.url)
      ) return;

      unique.add(source.url);

      const a =
        document.createElement("a");

      a.href = source.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      a.textContent =
        "• " +
        (source.title || source.url);

      sources.appendChild(a);
    });

    row.querySelector(".bubble")
      .appendChild(sources);
  }

  scrollBottom();
}

/* =========================
   IMAGE RESPONSE
========================= */

function renderImageResponse(data){

  if(
    !data.image ||
    !data.image.data
  ){

    renderError(
      "The server did not return an image."
    );

    return;
  }

  const row =
    document.createElement("div");

  row.className = "message ai";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  const label =
    document.createElement("div");

  label.className = "label";
  label.textContent = "TruX AI";

  const img =
    document.createElement("img");

  img.src =
    "data:" +
    data.image.mimeType +
    ";base64," +
    data.image.data;

  img.alt =
    "Generated image";

  img.onload = scrollBottom;

  bubble.appendChild(img);

  row.appendChild(label);
  row.appendChild(bubble);

  chatEl.appendChild(row);

  chats[currentChatId].messages.push({
    role:"trux",
    text:
      "[Generated Image]"
  });

  saveChats();

  scrollBottom();
}

/* =========================
   ERROR
========================= */

function renderError(message){

  const row =
    document.createElement("div");

  row.className = "message ai";

  row.innerHTML = `
    <div class="label">TruX AI</div>
    <div class="bubble" style="border-color:rgba(255,107,107,.4)">
      ⚠️ ${escapeHTML(message)}
    </div>
  `;

  chatEl.appendChild(row);

  scrollBottom();
}

/* =========================
   FORMAT TEXT
========================= */

function formatText(text){

  let html =
    escapeHTML(String(text));

  /*
   * Code blocks
   */
  html =
    html.replace(
      /```(?:[a-zA-Z0-9_+-]+)?\n?([\s\S]*?)```/g,
      (_,code) => {

        const id =
          "code_" +
          Math.random()
            .toString(36)
            .slice(2,9);

        return `
          <div class="code">
            <div class="code-head">
              <span>Code</span>
              <button
                onclick="copyCode('${id}')"
              >
                Copy
              </button>
            </div>

            <pre><code id="${id}">${code.trim()}</code></pre>
          </div>
        `;
      }
    );

  /*
   * Inline code
   */
  html =
    html.replace(
      /`([^`]+)`/g,
      '<span class="inline-code">$1</span>'
    );

  /*
   * Bold
   */
  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  /*
   * Markdown links
   */
  html =
    html.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:#00e5ff">$1</a>'
    );

  /*
   * Newlines
   */
  html =
    html.replace(/\n/g,"<br>");

  return html;
}

function escapeHTML(value){

  return value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

window.copyCode = async function(id){

  const el = document.getElementById(id);

  if(!el) return;

  try{

    await navigator.clipboard.writeText(
      el.innerText
    );

  }catch{

    alert("Copy failed.");
  }
};

/* =========================
   LOAD CHAT
========================= */

function loadChat(id){

  if(!chats[id]) return;

  currentChatId = id;

  welcome.classList.add("hidden");
  chatEl.classList.add("visible");

  chatEl.innerHTML = "";

  chats[id].messages.forEach(message => {

    if(message.role === "user"){

      addUserMessage(
        message.text
      );

    }else{

      const row =
        document.createElement("div");

      row.className = "message ai";

      row.innerHTML = `
        <div class="label">TruX AI</div>
        <div class="bubble">
          ${
            message.text ===
            "[Generated Image]"
              ? "🖼 Generated image"
              : formatText(message.text)
          }
        </div>
      `;

      chatEl.appendChild(row);
    }
  });

  renderHistory();

  if(window.innerWidth <= 700){
    sidebar.classList.add("closed");
  }
}

/* =========================
   SCROLL
========================= */

function scrollBottom(){

  requestAnimationFrame(() => {

    chatEl.scrollTop =
      chatEl.scrollHeight;

  });
}

/* =========================
   SETTINGS
========================= */

$("settingsBtn").onclick =
$("topSettings").onclick = () => {

  instructions.value =
    localStorage.getItem(
      STORAGE_INSTRUCTIONS
    ) || "";

  modal.classList.add("show");
};

$("closeModal").onclick = () => {
  modal.classList.remove("show");
};

$("saveInstructions").onclick = () => {

  localStorage.setItem(
    STORAGE_INSTRUCTIONS,
    instructions.value.trim()
  );

  modal.classList.remove("show");
};

$("clearChats").onclick = () => {

  if(!confirm(
    "Delete all local chat history?"
  )) return;

  chats = {};

  localStorage.removeItem(
    STORAGE_CHATS
  );

  newChat();
};

/* =========================
   VOICE
========================= */

$("micBtn").onclick = () => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice recognition is not supported on this browser."
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = event => {

    const text =
      event.results[0][0].transcript;

    input.value +=
      (input.value ? " " : "") +
      text;

    input.dispatchEvent(
      new Event("input")
    );
  };

  recognition.onerror = () => {
    console.log("Voice recognition error");
  };

  recognition.start();
};

/* =========================
   START
========================= */

loadStorage();
