name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trux.p12"
            echo "TRUX_KEYSTORE_PATH=$RUNNER_TEMP/trux.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set; the APK is signed with a throwaway debug key."
          fi
      - name: Build APK
        working-directory: android
        env:
          TRUX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRUX_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRUX_KEY_ALIAS: trux
          TRUX_VERSION_CODE: ${{ github.run_number }}
          TRUX_VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TruX-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TruX-AI-apk
          path: TruX-AI.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.${{ github.run_number }}
          name: TruX for Android 1.${{ github.run_number }}
          make_latest: "true"
          body: |
            Install TruX-AI.apk on your Android phone, open it and tap **Grant all** in Settings → Assistant.
            Then set it as your assistant: Settings → Apps → Choose default apps → Digital assistant app → TruX.
          files: TruX-AI.apk
