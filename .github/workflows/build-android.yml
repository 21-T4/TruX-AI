name: Build TruX-Omni Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: trux-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check Cloud Run server syntax
        run: node --check cloud-run-server.js

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trux-omni-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare named companion APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TruX-Omni-Android.apk

      - name: Publish companion APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trux-android-latest
          name: TruX-Omni Android Companion (Latest)
          body: |
            Installable TruX-Omni Android companion build from the main branch.
            This debug APK is for direct testing and enables native Android Live screen sharing and assistant-role registration.
          prerelease: true
          draft: false
          overwrite_files: true
          files: TruX-Omni-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
